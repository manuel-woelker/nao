name: Release

on:
  push:
    tags:
      - "v*"

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux2014_x86_64:2024-08-03-32dfa47
  MANYLINUX_CARGO_HOME: /workspace/.cargo-ci
  MANYLINUX_RUSTUP_HOME: /workspace/.rustup-ci

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            .cargo-ci/bin
            .cargo-ci/git
            .cargo-ci/registry
            .rustup-ci
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/workspace/.ci-home \
            -e CARGO_HOME="${MANYLINUX_CARGO_HOME}" \
            -e RUSTUP_HOME="${MANYLINUX_RUSTUP_HOME}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${MANYLINUX_IMAGE}" \
            bash -lc '
              set -euo pipefail
              python3 - <<'"'"'PY'"'"'
              import urllib.request
              with urllib.request.urlopen("https://sh.rustup.rs") as response:
                  data = response.read()
              with open("/tmp/rustup-init.sh", "wb") as file:
                  file.write(data)
              PY
              sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
              source "${CARGO_HOME}/env"
              cargo build --release -p nao --locked
            '

      - name: Package release artifacts
        env:
          TAG_NAME: ${{ github.ref_name }}
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          ARCHIVE_BASENAME="nao-${TAG_NAME}-${TARGET_TRIPLE}"
          ARTIFACT_DIR="dist/${ARCHIVE_BASENAME}"

          mkdir -p "${ARTIFACT_DIR}"
          cp target/release/nao "${ARTIFACT_DIR}/nao"
          cp README.md "${ARTIFACT_DIR}/README.md"

          tar -C dist -czf "dist/${ARCHIVE_BASENAME}.tar.gz" "${ARCHIVE_BASENAME}"
          sha256sum "dist/${ARCHIVE_BASENAME}.tar.gz" > "dist/${ARCHIVE_BASENAME}.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
