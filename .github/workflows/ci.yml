name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - name: default
            rust_targets: ""
            install_musl_tools: false
            cargo_build_args: --all-targets
            run_musl_tests: false
          - name: musl
            rust_targets: x86_64-unknown-linux-musl
            install_musl_tools: true
            cargo_build_args: --release --target x86_64-unknown-linux-musl -p nao --locked
            run_musl_tests: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.build.rust_targets }}

      - name: Install musl toolchain
        if: ${{ matrix.build.install_musl_tools }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.build.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.build.name }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        if: ${{ matrix.build.name == 'default' || matrix.build.run_musl_tests }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format check
        if: ${{ matrix.build.name == 'default' }}
        run: cargo fmt -- --check

      - name: Build
        run: cargo build ${{ matrix.build.cargo_build_args }}

      - name: Clippy
        if: ${{ matrix.build.name == 'default' }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ matrix.build.name == 'default' }}
        run: cargo nextest run

      - name: Musl tests
        if: ${{ matrix.build.run_musl_tests }}
        run: cargo nextest run --target x86_64-unknown-linux-musl --workspace --all-targets --all-features
