[package]
name = "nao"
version = "0.1.4"
edition = "2024"
build = "build.rs"
description = "CLI for the nao task runner"
license = "MIT"
repository = "https://github.com/manuel-woelker/nao"

[dependencies]
nao-base = { path = "../base", version = "0.1.4" }
nao-engine = { path = "../engine", version = "0.1.4" }
nao-pal = { path = "../pal", version = "0.1.4" }
nao-recipe = { path = "../recipe", version = "0.1.4" }
nao-tui = { path = "../tui", version = "0.1.4" }
shadow-rs = { workspace = true }
xflags = { workspace = true }

[build-dependencies]
shadow-rs = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
