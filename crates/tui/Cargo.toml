[package]
name = "nao-tui"
version = "0.1.6"
edition = "2024"
description = "Terminal UI for the nao task runner"
license = "MIT"
repository = "https://github.com/manuel-woelker/nao"

[dependencies]
nao-base = { path = "../base", version = "0.1.6" }
nao-engine = { path = "../engine", version = "0.1.6" }
nao-pal = { path = "../pal", version = "0.1.6" }
nao-recipe = { path = "../recipe", version = "0.1.6" }
crossterm = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tui-scrollview = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
