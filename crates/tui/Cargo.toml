[package]
name = "nao-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for the nao task runner"
license = "MIT"
repository = "https://github.com/manuel-woelker/nao"

[dependencies]
nao-base = { path = "../base" }
nao-engine = { path = "../engine" }
nao-pal = { path = "../pal" }
nao-recipe = { path = "../recipe" }
crossterm = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
